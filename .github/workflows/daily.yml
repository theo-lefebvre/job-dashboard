name: Recherche quotidienne d'offres

on:
  schedule:
    # GitHub travaille en heure UTC. Deux horaires couvrent l'heure d'été et d'hiver ;
    # l'étape "Heure de Paris" ci-dessous ne garde que celui qui tombe vers 7h à Paris.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:      # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write         # pour enregistrer docs/ et seen_offers.json
  issues: write           # pour créer l'issue qui t'envoie l'e-mail

concurrency:
  group: recherche-offres
  cancel-in-progress: false

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - name: Heure de Paris
        id: gate
        run: |
          HEURE=$(TZ=Europe/Paris date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HEURE" != "07" ]; then
            echo "Il est ${HEURE}h à Paris : on attend le créneau de 7h."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer le dépôt
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4

      - name: Installer Python
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les outils
        if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Lancer la recherche
        if: steps.gate.outputs.go == 'true'
        run: python -m jobfinder.main

      - name: Enregistrer la page et la mémoire
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "job-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs seen_offers.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau à enregistrer."
          else
            git commit -m "Mise à jour du dashboard"
            git pull --rebase
            git push
          fi

      - name: Créer l'alerte e-mail (issue)
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f alerts/issue_title.txt ]; then
            gh issue create \
              --title "$(cat alerts/issue_title.txt)" \
              --body-file alerts/issue_body.md \
              --assignee "${{ github.repository_owner }}"
          else
            echo "Aucune alerte aujourd'hui."
          fi
